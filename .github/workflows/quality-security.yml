name: Quality & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-and-secret-hygiene:
    name: Brand Hygiene & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run brand and machine-path hygiene check
        run: |
          chmod +x ./scripts/check_brand_hygiene.sh ./scripts/check_architecture_and_owners.sh
          ./scripts/check_brand_hygiene.sh
          ./scripts/check_architecture_and_owners.sh

      - name: Secret hygiene scan (gitleaks CLI)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          TMP_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}" -o "${TMP_DIR}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TMP_DIR}/${TARBALL}" | sha256sum -c -
          tar -xzf "${TMP_DIR}/${TARBALL}" -C "${TMP_DIR}" gitleaks
          "${TMP_DIR}/gitleaks" git --config .gitleaks.toml --redact --verbose .

  kmp-static-analysis:
    name: Spotless & Detekt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Library/Android/sdk" ]; then SDK_ROOT="$HOME/Library/Android/sdk"; fi
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Android/Sdk" ]; then SDK_ROOT="$HOME/Android/Sdk"; fi
          if [ -z "$SDK_ROOT" ]; then echo "ANDROID_HOME not found on runner" >&2; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" >/dev/null || true
          fi
          test -d "$SDK_ROOT/platforms/android-37.0" || test -d "$SDK_ROOT/platforms/android-37"

      - name: Run Spotless and Detekt
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessCheck detekt --no-daemon
