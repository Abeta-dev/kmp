name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish-wiki:
    name: Publish wiki/ to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync wiki pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_DIR="$(mktemp -d)"
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if ! git clone "$WIKI_URL" "$WIKI_DIR" 2>/dev/null; then
            echo "::notice::GitHub Wiki is not initialized yet for ${{ github.repository }}. Create the first page in the Wiki tab to enable automated sync."
            exit 0
          fi
          find "$WIKI_DIR" -maxdepth 1 -type f -name "*.md" -delete
          cp wiki/*.md "$WIKI_DIR/"
          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi
          git commit -m "docs(wiki): sync from main (${GITHUB_SHA::7})"
          git push origin HEAD
