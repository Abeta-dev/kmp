name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Full Release Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand hygiene check
        run: |
          chmod +x ./scripts/check_brand_hygiene.sh
          ./scripts/check_brand_hygiene.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP check
        working-directory: kmp
        run: |
          chmod +x ./gradlew
          ./gradlew check --no-daemon

      - name: Set up Go 1.26.0
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: bff/go.sum

      - name: Run Go BFF vet & tests
        working-directory: bff
        run: |
          go vet ./...
          go test -race -cover ./...

  publish-kmp-packages:
    name: Publish KMP BOM & Modules to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Maven artifacts to GitHub Packages
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon -Pabeta.kmpLocalBuild=false

  github-release:
    name: Create GitHub Release
    needs: publish-kmp-packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
