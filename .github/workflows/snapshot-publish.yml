name: Snapshot Publish (Cloudsmith Open Source)

on:
  push:
    branches: [main]
    paths:
      - "kmp/**"
      - ".github/workflows/snapshot-publish.yml"
  workflow_dispatch:
    inputs:
      snapshot_version:
        description: "Snapshot version to publish (must end in -SNAPSHOT; defaults to <catalogVersion>-SNAPSHOT)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: snapshot-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-snapshot-config:
    name: Check Cloudsmith Snapshot Configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      snapshot_version: ${{ steps.check.outputs.snapshot_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Cloudsmith Open Source credentials
        id: check
        env:
          CS_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          INPUT_VER: ${{ inputs.snapshot_version || '' }}
        run: |
          set -euo pipefail
          BASE_VER="$(grep -E '^kmpBom\s*=' kmp/dependencyManagement/gradle/internal.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          SNAP_VER="${INPUT_VER:-${BASE_VER}-SNAPSHOT}"
          if [[ "$SNAP_VER" != *-SNAPSHOT ]]; then
            SNAP_VER="${SNAP_VER}-SNAPSHOT"
          fi
          if [[ -n "${CS_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudsmith snapshot publishing enabled for ${SNAP_VER}."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDSMITH_API_KEY secret is not configured; skipping automated Cloudsmith snapshot publish. See docs/publishing-and-hosting.md."
          fi
          echo "snapshot_version=${SNAP_VER}" >> "$GITHUB_OUTPUT"

  publish-cloudsmith-snapshot:
    name: Publish Multiplatform SNAPSHOT to Cloudsmith (macOS)
    needs: check-snapshot-config
    if: needs.check-snapshot-config.outputs.enabled == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Library/Android/sdk" ]; then SDK_ROOT="$HOME/Library/Android/sdk"; fi
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Android/Sdk" ]; then SDK_ROOT="$HOME/Android/Sdk"; fi
          if [ -z "$SDK_ROOT" ]; then echo "ANDROID_HOME not found on runner" >&2; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" >/dev/null || true
          fi
          test -d "$SDK_ROOT/platforms/android-37.0" || test -d "$SDK_ROOT/platforms/android-37"

      - name: Publish SNAPSHOT artifacts to Cloudsmith Open Source
        env:
          CLOUDSMITH_ORG: ${{ vars.CLOUDSMITH_ORG || 'abeta-dev' }}
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'kmp' }}
          CLOUDSMITH_USER: ${{ vars.CLOUDSMITH_USER || 'token' }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          ABETA_PUBLISH_VERSION: ${{ needs.check-snapshot-config.outputs.snapshot_version }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToCloudsmithRepository --no-daemon \
            -Pabeta.kmpLocalBuild=false
