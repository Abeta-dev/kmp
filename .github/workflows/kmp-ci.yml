name: KMP CI

on:
  push:
    branches: [main]
    paths:
      - "kmp/**"
      - ".github/workflows/kmp-ci.yml"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "kmp/**"
      - ".github/workflows/kmp-ci.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-check:
    name: Build, Lint & Test (Java 21 / Gradle 9.7.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Library/Android/sdk" ]; then SDK_ROOT="$HOME/Library/Android/sdk"; fi
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Android/Sdk" ]; then SDK_ROOT="$HOME/Android/Sdk"; fi
          if [ -z "$SDK_ROOT" ]; then echo "ANDROID_HOME not found on runner" >&2; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" >/dev/null || true
          fi
          test -d "$SDK_ROOT/platforms/android-37.0" || test -d "$SDK_ROOT/platforms/android-37"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Gradle check
        run: ./gradlew check --no-daemon --stacktrace

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-check-reports
          path: |
            kmp/**/build/reports/
            kmp/**/build/test-results/
          if-no-files-found: ignore

  macos-apple-verify:
    name: Apple Simulator Frameworks, macOS Tests & SwiftPM Typecheck
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Library/Android/sdk" ]; then SDK_ROOT="$HOME/Library/Android/sdk"; fi
          if [ -z "$SDK_ROOT" ] && [ -d "$HOME/Android/Sdk" ]; then SDK_ROOT="$HOME/Android/Sdk"; fi
          if [ -z "$SDK_ROOT" ]; then echo "ANDROID_HOME not found on runner" >&2; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" >/dev/null || true
          fi
          test -d "$SDK_ROOT/platforms/android-37.0" || test -d "$SDK_ROOT/platforms/android-37"

      - name: Link Apple simulator frameworks & run macOS native tests
        working-directory: kmp
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :sdui-layout:linkDebugFrameworkIosSimulatorArm64 \
            :watch-companion:linkDebugFrameworkWatchosSimulatorArm64 \
            :core:macosArm64Test \
            :state:macosArm64Test \
            :database:macosArm64Test \
            :network:macosArm64Test \
            :action-engine:macosArm64Test \
            :watch-companion:macosArm64Test \
            --no-daemon --stacktrace

      - name: Verify SwiftPM manifest & typecheck SwiftUI wrappers (Swift 5 & 6)
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify_spm_package.sh
          TMP_SPM_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_SPM_DIR"' EXIT
          CI_TAG="v0.8.0-ci"
          SYNTHETIC_SHA="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          sed \
            -e "s|<TAG>|${CI_TAG}|g" \
            -e "s|<SHA256_CHECKSUM_FOR_ABETASDUIKIT_FROM_SHA256SUMS_TXT>|${SYNTHETIC_SHA}|g" \
            -e "s|<SHA256_CHECKSUM_FOR_ABETAWATCHKIT_FROM_SHA256SUMS_TXT>|${SYNTHETIC_SHA}|g" \
            kmp/platforms/apple/Package.template.swift > "${TMP_SPM_DIR}/Package.swift"
          ./scripts/verify_spm_package.sh "${TMP_SPM_DIR}/Package.swift" \
            --expected-tag "${CI_TAG}" \
            --sdui-framework kmp/sdui-layout/build/bin/iosSimulatorArm64/debugFramework \
            --watch-framework kmp/watch-companion/build/bin/watchosSimulatorArm64/debugFramework

      - name: Upload macOS build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-apple-verify-reports
          path: |
            kmp/**/build/reports/
            kmp/**/build/test-results/
          if-no-files-found: ignore
